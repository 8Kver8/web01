<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>HomePro</title>
    <link rel="stylesheet" href="main.css" />
  </head>

  <body>
    <div class="navbar">
      <div class="nav-container">
        <div class="logo-group">
          <div class="logo-image-wrapper">
            <img src="images/logo.svg" alt="logo" class="logo-img" />
          </div>

          <div class="logo-text-wrapper">
            <span class="logo-text">HomePro</span>
          </div>
        </div>

        <div class="menu-container">
          <div class="menu-item-about">
            <a href="#" class="menu-link">About Us</a>
          </div>

          <div class="menu-item-services">
            <a href="#" class="menu-link">Services</a>
          </div>

          <div class="menu-item-blog">
            <a href="#" class="menu-link">Our Blog</a>
          </div>

          <div class="menu-item-contact">
            <a href="#" class="menu-link">Contact</a>
          </div>
        </div>

        <div class="special-container">
          <img
            src="images/red_circle.svg"
            alt="Red circle"
            class="circle-img"
          />
          <span class="special-text">24 Hour Services</span>
        </div>
      </div>
    </div>

    <img src="images/person_left.svg" alt="person left" class="person-left" />

    <img
      src="images/person_right.svg"
      alt="person right"
      class="person-right"
    />

    <div class="services-row">
      <span>Maintenances</span>
      <span class="dot">&bullet;</span>
      <span>Repairs</span>
      <span class="dot">&bullet;</span>
      <span>Improvements</span>
    </div>
  </body>
</html>
